<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wreckage / Workshop</title><style>*{box-sizing:border-box}body{margin:0;background:#111510;color:#ecefe5;font:15px system-ui,sans-serif;padding:6vw;max-width:1100px}a{color:#d6fb53;text-decoration:none}.eyebrow{color:#d6fb53;letter-spacing:3px;font-size:11px}h1{font-size:clamp(38px,7vw,78px);letter-spacing:-4px;margin:25px 0}p{color:#8f988a;line-height:1.7}.row{border-top:1px solid #31372b;padding:23px 0;display:grid;grid-template-columns:1fr auto;gap:8px}.row strong{font-size:19px}.row small{grid-row:2;color:#91998a}.badge{font:10px monospace;letter-spacing:2px;text-transform:uppercase;color:#d6fb53;align-self:center}.badge[data-state=queued]{color:#848d7d}footer{margin-top:36px;font:11px monospace;color:#8f988a}header{display:flex;justify-content:space-between}</style></head><body><header><span class="eyebrow">WRECKAGE / LIVE WORKSHOP</span><a href="/">↗ Back to arena</a></header><h1 id="phase">Building the first playable</h1><p>A playable browser demolition derby. Specialist builds, independent playtests, and an honest record of what has been checked. This page refreshes automatically.</p><div id="items"></div><footer id="updated"></footer><script>async function refresh(){try{const d=await(await fetch('/progress.json?t='+Date.now())).json();document.querySelector('#phase').textContent=d.phase;const root=document.querySelector('#items');root.replaceChildren(...d.items.map(i=>{const row=document.createElement('div');row.className='row';const title=document.createElement('strong');title.textContent=i.name;const small=document.createElement('small');small.textContent=i.detail;const badge=document.createElement('span');badge.className='badge';badge.dataset.state=i.status;badge.textContent=i.status;row.append(title,badge,small);return row}));document.querySelector('#updated').textContent='LATEST / '+d.updated}catch(e){document.querySelector('#updated').textContent='Reconnecting to workshop…'}}refresh();setInterval(refresh,4000)</script></body></html>
