<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; }
  main { max-width: 640px; padding: 32px 24px; text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 12px; }
  p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.6; }
  a.button { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #38bdf8; color: #082f49; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>PlayGround is ready</h1>
  <p>Static preview is serving correctly. This placeholder unblocks startup and capture validation.</p>
  <a class="button" href="#">Get started</a>
</main>
</body>
</html>
