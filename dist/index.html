<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; padding: 16px; box-sizing: border-box; }
  main { width: min(640px, 100%); padding: clamp(24px, 5vw, 48px) clamp(16px, 4vw, 32px); text-align: center; background: #1e293b; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4); box-sizing: border-box; }
  h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 6vw, 2.5rem); overflow-wrap: break-word; }
  p { margin: 8px 0; color: #cbd5e1; line-height: 1.6; }
  .badge { display: inline-block; margin-bottom: 16px; padding: 4px 12px; border-radius: 999px; background: #22c55e; color: #052e16; font-weight: 700; font-size: .8rem; }
  canvas { margin-top: 20px; border-radius: 12px; background: #020617; width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main>
  <span class="badge">READY</span>
  <h1>PlayGround is running</h1>
  <p>Static build served from <code>dist/</code> inside the project directory.</p>
  <p>If you can see this page, startup and preview are working.</p>
  <canvas id="demo" width="560" height="200"></canvas>
</main>
<script>
  const c = document.getElementById('demo').getContext('2d');
  c.fillStyle = '#38bdf8';
  c.fillRect(20, 20, 520, 160);
  c.fillStyle = '#0f172a';
  c.font = 'bold 32px system-ui';
  c.fillText('Hello PlayGround', 120, 115);
</script>
</body>
</html>
